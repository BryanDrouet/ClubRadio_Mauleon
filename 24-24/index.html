<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="ClubRadio Mauléon - Overlay OBS 24/7">
    <title>ClubRadio 24/7 - Overlay OBS</title>

    <link rel="stylesheet"
          href="style.css">

    <script src="config.js"></script>
</head>

<body>

    <aside class="progress-bar"
           id="progressBar">
        <div class="video-info">
            <span class="video-title"
                  id="videoTitle"></span>
            <span class="video-time"
                  id="videoTime"></span>
            <span class="video-remaining"
                  id="videoRemaining"></span>
        </div>
        <div class="progress-track">
            <div class="progress-fill"
                 id="progressFill"></div>
        </div>
    </aside>

    <main class="obs-container">

        <section class="video-container"
                 id="videoContainer">

            <video id="mainVideo"
                   class="main-video"
                   preload="auto"
                   muted
                   autoplay
                   playsinline
                   disablepictureinpicture>
                Votre navigateur ne supporte pas la balise vidéo HTML5.
            </video>

            <audio id="musicPlayer"
                   class="music-player"
                   preload="auto"
                   muted
                   autoplay>
                Votre navigateur ne supporte pas la balise audio HTML5.
            </audio>

            <div id="youtubeContainer"
                 class="youtube-container"></div>

            <div id="loadingIndicator"
                 class="loading-indicator">
                <div class="spinner"></div>
                <p class="loading-text">Chargement en cours...</p>
            </div>

            <div id="errorIndicator"
                 class="error-indicator">
                <div class="error-icon"></div>
                <p class="error-text">Erreur de chargement - Passage à la vidéo suivante...</p>
            </div>
        </section>

        <aside class="ticker-bar"
               id="tickerBar">

            <div class="ticker-content"
                 id="tickerContent">
                <span class="ticker-message"
                      id="tickerMessage"></span>
            </div>
        </aside>

        <div class="info-overlay"
             id="infoOverlay">

            <div class="music-indicator"
                 id="musicIndicator">
                Pause Musicale
            </div>
        </div>

    </main>

    <script src="app.js"></script>

</body>

</html>
