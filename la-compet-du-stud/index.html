<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Compèt' du Stud - Saison 2</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="waves-container">
        <div class="gradient"></div>
        <div class="gradient"></div>
        <div class="gradient"></div>
    </div>

    <header>
        <h1><i data-lucide="trophy"></i> La Compèt' du Stud - Saison 2</h1>
        <div id="auth-section">
            <button id="login-btn"><i data-lucide="log-in"></i> Connexion Google</button>
            <button id="logout-btn" class="hidden"><i data-lucide="log-out"></i> Déconnexion</button>
        </div>
    </header>

    <main>
        <div id="admin-panel" class="hidden">
            <input type="text" id="new-name" placeholder="Nom du participant">
            <button id="add-btn"><i data-lucide="user-plus"></i> Ajouter</button>
        </div>

        <div id="scoreboard"></div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
