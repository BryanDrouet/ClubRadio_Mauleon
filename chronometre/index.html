<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, orientation=landscape">
    <title>Compteur de Temps Écoulé</title>
    <link rel="icon" href="assets/off.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <button class="menu-toggle" id="menuToggle"><i data-lucide="menu"></i></button>
    <button class="full-screen-button" id="fullscreenButton"><i data-lucide="maximize"></i></button>

    <div id="settingsMenu">
        <h3>Réglages</h3>
        <button id="removeButtons">Enlever les boutons</button>
        <button id="removeBookmarks">Enlever les signets</button>
    </div>

    <div class="container">
        <div id="timer">00:00:00:0</div>
        <div class="buttons" id="buttonsContainer">
            <button id="recButton">REC</button>
            <button id="resetButton" disabled>Reset</button>
            <button id="bookmarkButton" disabled>Signet</button>
        </div>
        <div id="bookmarksContainer" class="signet-list"></div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
